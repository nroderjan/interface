<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rede Social</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- Cabeçalho da página -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-users"></i>
            <span>Social</span>
        </div>
        <nav class="nav">
            <a href="#"><i class="fas fa-home"></i> Início</a>
            <a href="#"><i class="fas fa-user-circle"></i> Perfil</a>
            <a href="#"><i class="fas fa-bell"></i> Notificações</a>
            <a href="#"><i class="fas fa-search"></i> Buscar</a>
        </nav>
    </header>

    <!-- Conteúdo principal (Feed) -->
    <main class="main-content">
        <div class="feed-container">
            <!-- Post 1 -->
            <div class="post-card">
                <div class="post-header">
                    <img src="https://via.placeholder.com/50" alt="Foto de Perfil de Nome do Usuário"
                        class="profile-pic">
                    <div class="post-info">
                        <strong>Nome do Usuário</strong>
                        <span>@usuario_exemplo</span>
                        <span class="post-time">Há 10 minutos</span>
                    </div>
                </div>
                <div class="post-body">
                    <p>Essa é a minha primeira postagem na nova rede social! 🎉</p>
                </div>
                <div class="post-actions">
                    <button><i class="far fa-heart"></i> Curtir</button>
                    <button><i class="far fa-comment"></i> Comentar</button>
                    <button><i class="far fa-share-square"></i> Compartilhar</button>
                </div>
            </div>

                        <span>@usuario_dois</span>
                        <span class="post-time">Há 3 horas</span>
                    </div>
